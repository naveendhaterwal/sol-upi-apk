[package]
name = "solupi-backend"
default-run = "solupi-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "solupi_backend"
path = "src/lib.rs"

[[bin]]
name = "solupi-backend"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

solana-client = "2.1.0"
solana-sdk = "2.1.0"
bs58 = "0.5.1"

dotenvy = "0.15"
prisma-client-rust = { git = "https://github.com/Brendonovich/prisma-client-rust", tag = "0.6.11", default-features = false, features = ["postgresql"] }
prisma-client-rust-cli = { git = "https://github.com/Brendonovich/prisma-client-rust", tag = "0.6.11", default-features = false, features = ["postgresql"] }
reqwest = { version = "0.13.3", features = ["json"] }
vercel_runtime = "1.1.0"
